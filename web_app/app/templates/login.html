<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Godrej Vision Inspection</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/login"><span class="brand-mark">G</span><span>Godrej <small>VISION INSPECTION</small></span></a>
    <h1>Sign in</h1>
    <p class="muted">Access the live Jetson inspection dashboard.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf_token }}" />
      <label>Username<input name="username" autocomplete="username" required /></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
      <button class="primary-button" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
