<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inspect Web App</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Inspect Web App</h1>
    {% if username %}
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/history">History</a>
      <a href="/settings">Settings</a>
      <form method="post" action="/logout" class="inline"><button type="submit">Logout ({{ username }})</button></form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
